server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Toda la API cuelga de /api, incluidos los archivos de /uploads.
    context-path: /api

spring:
  application:
    name: app-movilidad-colaborativa-api
  mongodb:
    # Clúster de Atlas. DB_USER, DB_PASSWORD y DB_HOST son obligatorias: sin ellas la API no arranca.
    uri: mongodb+srv://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME:localhost}?retryWrites=true&w=majority
  data:
    mongodb:
      # Crea los índices declarados con @Indexed (correo único, TTL del OTP).
      auto-index-creation: true
      # Los campos de los documentos van en snake_case: contrasenaHash -> contrasena_hash.
      field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
  mail:
    # Gmail: SMTP_USERNAME es la cuenta y SMTP_PASSWORD una contraseña de aplicación (no la de la cuenta).
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  cors:
    # Orígenes del frontend (Vite dev y preview), separados por coma.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    # Clave HS256 de al menos 32 caracteres. Obligatoria: sin ella la API no arranca.
    secret: ${JWT_SECRET}
    registration-ttl: ${JWT_REGISTRATION_TTL:15m}
    pre-auth-ttl: ${JWT_PRE_AUTH_TTL:10m}
    session-ttl: ${JWT_SESSION_TTL:8h}
  otp:
    ttl: ${OTP_TTL:5m}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    resend-after: ${OTP_RESEND_AFTER:45s}
  mail:
    # Con false no se envía el correo: el código OTP se escribe en el log del backend.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${SMTP_USERNAME:}}
